name: Sync AI docs to all repos

on:
  push:
    branches: [main]
    paths:
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'docs/ai/**'
      - 'templates/**'
      - '.github/workflows/sync-ai-docs.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [miranote-web, miranote-api, miranote-ios, mirabot]
    steps:
      - name: Checkout source (.github)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target (${{ matrix.repo }})
        uses: actions/checkout@v4
        with:
          repository: MiraNote-AI/${{ matrix.repo }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Mirror docs and target stub
        run: |
          set -euo pipefail
          cp source/CLAUDE.md target/CLAUDE.md
          cp source/CONTRIBUTING.md target/CONTRIBUTING.md
          mkdir -p target/docs/ai
          rsync -a --delete source/docs/ai/ target/docs/ai/
          mkdir -p target/.github/workflows
          cp source/templates/target-workflow.yml target/.github/workflows/checks.yml

      - name: Open PR (skip if no diff)
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SOURCE_SHA:0:7}"

          git config user.name "miranote-sync-bot"
          git config user.email "miranote-sync-bot@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.repo }} — skipping."
            exit 0
          fi

          branch="chore/sync-ai-docs-${short}"
          git checkout -b "$branch"
          git commit -m "chore: sync AI docs from MiraNote-AI/.github@${short}"
          git push -u origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync AI docs from .github@${short}" \
            --body "Auto-sync from [MiraNote-AI/.github@${short}](https://github.com/MiraNote-AI/.github/commit/${SOURCE_SHA}).

Generated by \`.github/workflows/sync-ai-docs.yml\`."
